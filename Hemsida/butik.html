<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="shop-page">

    <!-- Toppmeny för undersidan -->
    <header class="subpage-header">
        <!-- Tillbakaknapp uppe till vänster -->
        <a href="index.html" class="back-btn">← Startsida</a>
        
        <!-- Företagsnamn i mitten -->
        <div class="header-title">
            <span>Var Har Vi Hamnat UF</span>
        </div>

        <!-- Logotyp uppe till höger -->
        <div class="header-logo">
            <img src="logga.jpg" alt="Företagets Logotyp">
        </div>
    </header>

    <!-- Butiksinnehåll -->
    <main class="page-container">
        <section class="shop-section">
            <h1>Vår Butik</h1>
            
            <!-- Produktkort centrerat på sidan -->
            <div class="product-card">
                <div class="product-image-container">
                    <!-- Bild på produkten -->
                    <img src="produkt.jpg" alt="Produktbild" class="product-img">
                    <!-- Pris precis under bilden -->
                    <p class="product-price">229 kr</p>
                </div>

                <!-- Informationsdel till höger om bilden -->
                <div class="product-info">
                    <h2>Var Har Vi Hamnat</h2>
                    <p class="product-description">
                        Här kan du skriva en kort och lockande beskrivning av produkten.
                    </p>
                    <!-- Knapp för att gå in på själva produkten -->
                    <a href="produkt.html" class="buy-btn">Visa produkt</a>
                </div>
            </div>
        </section>
    </main>
<!-- Koppla in skriptet för scroll-magin -->
    <script src="script.js"></script>
</body>
</html>
